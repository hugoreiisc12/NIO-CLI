# Config declarativa do Kong (DB-less). Kong entra na frente do `nio-gateway` e aplica as regras de roteamento e plugins (rate-limitng) 
_format_version: "3.0"

services:
  - name: nio-gateway
    url: http://nio-gateway:3000
    routes:
      # /login — alvo de brute-force; rate-limit apertado.
      - name: nio-gateway-login
        paths:
          - /login
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              policy: local
      - name: nio-gateway-logout
        paths:
          - /logout
        strip_path: false
      # /verify-2fa e /security/* — OTP + gerência do 2º fator (spec 0004).
      # cada SMS custa; brute-force de OTP de 6 dígitos → limite mais baixo.
      - name: nio-gateway-verify-2fa
        paths:
          - /verify-2fa
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local
      - name: nio-gateway-security
        paths:
          - /security
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local
      - name: nio-gateway-health
        paths:
          - /health
        strip_path: false
