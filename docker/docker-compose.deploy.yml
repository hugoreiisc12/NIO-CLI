# Stack NIO — variante de DEPLOY (CD via Portainer GitOps). APP-ONLY: gateway,
# headroom, mcp e kong. O Portainer NÃO entra aqui — é o plano de gestão, roda
# standalone e deploya este compose (não gerencia a si mesmo).
# Difere do docker-compose.yml (dev): o nio-gateway vem PRONTO do GHCR (sem build),
# os segredos entram por env var do stack (não env_file), e o Kong fica exposto na
# LAN. Ver docs/ci-cd-architecture.md.
#
# O tag da imagem do gateway é pinado pelo workflow image.yml a cada release (v*).
name: nio

networks:
  nio-net:
    name: nio-net
    driver: bridge

volumes:
  nio_headroom_cache: { name: nio_headroom_cache }

services:
  nio-gateway:
    image: ghcr.io/hugoreiis12-png/nio-gateway:v0.3.5  # bumped by .github/workflows/image.yml
    container_name: nio-gateway
    restart: unless-stopped
    environment:
      NIO_GATEWAY_HOST: "0.0.0.0"       # ouvir na rede do container
      NIO_GATEWAY_PORT: "3000"
      NIO_DATABASE_URL: "${NIO_DATABASE_URL}"   # env var do stack no Portainer
      JWT_SECRET: "${JWT_SECRET}"               # env var do stack no Portainer
    # SEM publish de porta no host: o gateway é alcançado só pela `nio-net` (Kong o
    # acha por nome). Isso evita conflito de :3000 e força o tráfego pelo Kong (:8000),
    # onde vale o rate-limiting. Debug local: `curl http://127.0.0.1:8000/health`.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [ nio-net ]

  headroom:
    image: ghcr.io/headroomlabs-ai/headroom@sha256:35b799e94eef4644cb15a2e695b4b99698fe7668614623e9338cb10c10ececf9  # headroom:latest, pinado 2026-09-03
    container_name: nio-headroom
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8787"]
    environment:
      OPENAI_TARGET_API_URL: "${NIO_HEADROOM_OPENAI_TARGET:-https://opencode.ai/zen/v1}"
      HEADROOM_UPDATE_CHECK: "off"
    ports:
      # LAN — Headroom COMPARTILHADO: clientes sem Docker apontam NIO_HEADROOM_URL
      # pra cá (http://<host>:<porta>/v1). Porta configurável; default 8787.
      - "${NIO_HEADROOM_PORT:-8787}:8787"
    volumes: [ "nio_headroom_cache:/root/.headroom" ]
    networks: [ nio-net ]

  mcp-gateway:
    image: docker/mcp-gateway@sha256:f5a679a05fc39022a046167bef92aeeb01bcd59485ad27843ae5227db7950688  # docker/mcp-gateway:latest, pinado 2026-09-03
    container_name: nio-mcp-gateway
    restart: unless-stopped
    command: ["--transport=streaming", "--port=8811", "--servers=docker"]
    ports:
      - "127.0.0.1:8811:8811"           # host-local
    volumes: [ "/var/run/docker.sock:/var/run/docker.sock" ]
    networks: [ nio-net ]

  # NOTA: o Portainer NÃO faz parte deste stack — ele é o plano de gestão, roda
  # standalone e é quem deploya este compose (não pode gerenciar a si mesmo).

  kong:
    image: kong@sha256:2a8cf3b110cdaba1cb00adc665b8635ed1fc75c907f7a4298613c68e4976de0a  # kong:3.9, pinado 2026-09-03
    container_name: nio-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes: [ "./kong.yml:/kong/kong.yml:ro" ]   # docker/kong.yml no repo
    ports:
      # INGRESSO na LAN — porta do host configurável (NIO_KONG_PROXY_PORT), pois :8000
      # pode estar ocupada no host. Default 8000; neste host use 8080.
      - "${NIO_KONG_PROXY_PORT:-8000}:8000"
      - "127.0.0.1:8001:8001"           # admin API só local (não expor na LAN)
    depends_on:
      nio-gateway: { condition: service_healthy }
    networks: [ nio-net ]
