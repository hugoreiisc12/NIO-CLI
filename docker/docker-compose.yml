# Compose file for NIO CLI (dockerized) - T3
name: nio

networks:
  nio-net:
    name: nio-net
    driver: bridge
  nio-infra:
    name: nio-infra
    driver: bridge

volumes:
  nio_portainer_data: { name: nio_portainer_data }
  nio_headroom_cache: { name: nio_headroom_cache }

services:
  nio-gateway:
    build:
      context: ..
      dockerfile: Dockerfile.gateway
    image: nio-gateway:local
    container_name: nio-gateway
    restart: unless-stopped
    env_file: [ ../.env ]               # NIO_DATABASE_URL, JWT_SECRET (gitignored)
    environment:
      # o gateway lê env via env() que PREFIXA NIO_ → a var é NIO_GATEWAY_HOST
      # (não GATEWAY_HOST). 0.0.0.0 = ouvir na interface da rede, não só loopback.
      NIO_GATEWAY_HOST: "0.0.0.0"
    ports: [ "127.0.0.1:3000:3000" ]    # acesso direto da CLI (padrão)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [ nio-net ]

  headroom:
    image: ghcr.io/headroomlabs-ai/headroom@sha256:35b799e94eef4644cb15a2e695b4b99698fe7668614623e9338cb10c10ececf9  # headroom:latest, pinado 2026-09-03
    container_name: nio-headroom
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8787"]
    environment:
      OPENAI_TARGET_API_URL: "${NIO_HEADROOM_OPENAI_TARGET:-https://opencode.ai/zen/v1}"
      HEADROOM_UPDATE_CHECK: "off"
    ports: [ "127.0.0.1:8787:8787" ]
    volumes: [ "nio_headroom_cache:/root/.headroom" ]
    networks: [ nio-net ]

  kong:
    image: kong@sha256:2a8cf3b110cdaba1cb00adc665b8635ed1fc75c907f7a4298613c68e4976de0a  # kong:3.9, pinado 2026-09-03
    container_name: nio-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      # Admin API desligada (auditoria M-7) — config é declarativa (kong.yml),
      # nada chama o admin em runtime.
      KONG_ADMIN_LISTEN: "off"
    volumes: [ "./kong.yml:/kong/kong.yml:ro" ]          # docker/kong.yml (T3)
    ports:
      - "127.0.0.1:${NIO_KONG_PROXY_PORT:-8000}:8000"    # sem colisão: Portainer largou :8000
    depends_on:
      nio-gateway: { condition: service_healthy }
    networks: [ nio-net ]

  # ── plano de infra (toca o docker.sock) — rede nio-infra ─────────────

  mcp-gateway:
    image: docker/mcp-gateway@sha256:f5a679a05fc39022a046167bef92aeeb01bcd59485ad27843ae5227db7950688  # docker/mcp-gateway:latest, pinado 2026-09-03
    container_name: nio-mcp-gateway
    restart: unless-stopped
    command: ["--transport=streaming", "--port=8811", "--servers=docker"]
    ports: [ "127.0.0.1:8811:8811" ]
    # Mount DIRETO de propósito: o `--servers=docker` existe pra CRIAR containers
    # (tools de Docker pro operador de IA). Um proxy que permita isso é a própria
    # fuga — então a contenção aqui é: rede isolada + rodar opt-in
    # (`nio docker toolkit up/down`). Contenção real = daemon dedicado (backlog).
    volumes: [ "/var/run/docker.sock:/var/run/docker.sock" ]
    networks: [ nio-infra ]

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    container_name: nio-docker-proxy
    restart: unless-stopped
    environment:
      # GET-only: sem POST → ninguém cria/inicia/exec container através dele.
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      PING: 1
      # POST/EXEC/AUTH/SECRETS/CONFIGS/SWARM/SERVICES/SYSTEM/PLUGINS: 0 (default).
    volumes: [ "/var/run/docker.sock:/var/run/docker.sock:ro" ]
    networks: [ nio-infra ]

  portainer:
    image: portainer/portainer-ce@sha256:511f3f06c96fe3b993ebeaafde311c1959cae73a7ef825dba6397d51b450dffa  # portainer-ce:lts, pinado 2026-09-03
    container_name: nio-portainer
    restart: unless-stopped
    # Fala com o daemon SÓ pelo proxy GET-only (auditoria M-8) — não monta o
    # docker.sock. Efeito: dashboard read-mostly (vê containers/logs/stats/redes;
    # não sobe/derruba pela UI). Se o time precisar gerenciar pela UI, ligue
    # `POST: 1` no docker-socket-proxy — mas aí Portainer volta a poder criar
    # container = root no host.
    command: -H tcp://docker-socket-proxy:2375
    ports: [ "127.0.0.1:9443:9443" ]    # UI (edge :8000 REMOVIDO — libera p/ Kong)
    volumes:
      - "nio_portainer_data:/data"
    depends_on: [ docker-socket-proxy ]
    networks: [ nio-infra ]
