# Headroom — proxy de compressão de contexto entre o client de IA e o LLM.
# Obrigatório pro `nio ai` (ADR 0007). Mesmo padrão do `docker/docker-compose.yml`:
# porta pinada em 127.0.0.1, `restart: unless-stopped`, `extra_hosts` p/ Linux.
#
# O entrypoint da imagem já é `headroom proxy` — `command` passa só flags.
# `OPENAI_TARGET_API_URL` roteia as chamadas OpenAI-compatíveis (o operador usa
# OpenCode Zen) pro Zen; o header Authorization do OpenCode passa transparente,
# então o Headroom não precisa de API key própria.
services:
  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:latest
    container_name: nio-headroom
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8787"]
    environment:
      OPENAI_TARGET_API_URL: "${NIO_HEADROOM_OPENAI_TARGET:-https://opencode.ai/zen/v1}"
      HEADROOM_UPDATE_CHECK: "off"
    ports:
      - "127.0.0.1:${NIO_HEADROOM_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nio_headroom_cache:/root/.headroom

volumes:
  nio_headroom_cache:
    name: nio_headroom_cache
