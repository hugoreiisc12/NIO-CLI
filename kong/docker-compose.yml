# Configuração do Kong Gateway para o NIO-CLI
services:
  kong:
    image: kong:3.9
    container_name: nio-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    ports:
      # portas do host parametrizáveis (default 8000/8001) — evita colisão com
      # outros serviços locais. Se mudar a de proxy, ajuste NIO_GATEWAY_URL/NIO_KONG_PROXY_PORT na CLI.
      - "127.0.0.1:${NIO_KONG_PROXY_PORT:-8000}:8000" # proxy — é o que a CLI chama (GATEWAY_URL)
      - "127.0.0.1:${NIO_KONG_ADMIN_PORT:-8001}:8001" # admin API, só debug local
    extra_hosts:
      - "host.docker.internal:host-gateway" # necessário no Linux; noop no Docker Desktop