
# `docker compose -f kong/docker-compose.yml up` — Kong OSS, DB-less, na
# frente do `nio-gateway` (que roda no host, fora do Docker — ver kong.yml).
# Portas do HOST em 127.0.0.1 explícito, não 0.0.0.0 — mesma regra de
# loopback-only do resto do Gateway (ver docs/v2/ARQUITETURA-GATEWAY.md).
services:
  kong:
    image: kong:latest
    container_name: nio-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    ports:
      - "127.0.0.1:8000:8000" # proxy,  é isto que a CLI chama agora (GATEWAY_URL)
      - "127.0.0.1:8001:8001" # admin API só debug local (curl 127.0.0.1:8001)
    extra_hosts:
      - "host.docker.internal:host-gateway" # necessário no Linux; noop no Docker Desktop