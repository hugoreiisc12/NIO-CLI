# Config declarativa do Kong (DB-less — sem banco próprio, recarrega no
# restart do container). Kong entra na FRENTE do `nio-gateway` (porta 3000,
# roda no host, não no container) — proxy puro, nenhuma mudança de código
# do lado da aplicação quando isto for ligado/desligado.
#

_format_version: "3.0"

services:
  - name: nio-gateway
    url: http://host.docker.internal:3000
    routes:
      # /login é o alvo de brute-force identificado em docs/v2/PROGRESSO.md
      # (24 ago) — único com rate-limiting por enquanto.
      - name: nio-gateway-login
        paths:
          - /login
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              policy: local
      - name: nio-gateway-logout
        paths:
          - /logout
        strip_path: false
      # /verify-2fa e /security/* — código OTP + gerência do 2º fator (spec 0004).
      # rate-limit mais apertado: cada SMS custa; brute-force de OTP de 6 dígitos.
      - name: nio-gateway-verify-2fa
        paths:
          - /verify-2fa
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local
      - name: nio-gateway-security
        paths:
          - /security
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local
      - name: nio-gateway-health
        paths:
          - /health
        strip_path: false