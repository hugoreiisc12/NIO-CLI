name: CodeQL

# Análise estática de segurança (JS/TS). Resultados em Security → Code scanning.
on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 4 * * 1'   # segundas, 04:23 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
