name: CI

# Gate de qualidade: typecheck + build + testes (integração contra um Postgres
# EFÊMERO — nunca o banco de prod). Ver docs/ci-cd-architecture.md.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_call:   # reutilizável: publish.yml/image.yml chamam como gate antes de release

jobs:
  # Gate de segredo. Roda antes/junto do test e também nos gates de release
  # (publish.yml/image.yml chamam este workflow) — não publica com segredo vazado.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan de segredos
        run: bash scripts/scan-secrets.sh

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector = postgres oficial + extensão `vector` já no host.
        # A imagem `postgres:16` pura não tem pgvector, e o `db/schema.sql` faz
        # `CREATE EXTENSION vector` (tabelas do RAG de DAX) — quebraria no bootstrap.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nio_cli
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NIO_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nio_cli
      # § 11.2: o preload de `bun test` (scripts/test-env.ts) apaga NIO_DATABASE_URL
      # por padrão — só integração de propósito, nunca o .env de um dev sem querer.
      # O CI declara o opt-in explicitamente: este Postgres É efêmero e descartável.
      NIO_TEST_DB_OK: "1"
      # ≥ 32 chars + variedade — o gateway rejeita segredo fraco (auditoria H-1).
      # Valor de teste efêmero, não é segredo real.
      JWT_SECRET: ci-only-4f9c2ka7Qh1Zpx8Rbn3Vdw6Tty0Lms5Ej  # nio-allow-secret: efêmero do runner
      # SP-7: o CI não fala com api.pwnedpasswords.com — só a checagem local roda.
      NIO_HIBP_DISABLE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Formatação (Biome)
        # Só o FORMATTER (whitespace/aspas/wrap) — determinístico, zero achado
        # pendente agora que o repo foi formatado (§10.1). O LINTER do Biome já
        # está configurado em biome.json (preset "recommended") mas tem ~400
        # achados pré-existentes (código real, não estilo) que exigem triagem
        # própria — não é gate ainda, de propósito, pra não bloquear release por
        # dívida que já existia. Rode `bunx biome lint .` localmente pra ver.
        run: bunx biome format .

      - name: Build
        run: bun run build

      - name: Apply schema (Postgres efêmero)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          psql "$NIO_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Registrar baseline de migrações
        # schema.sql já inclui 0001..000N — marca como aplicadas e depois roda o
        # que sobrar (migração nova ainda não incorporada ao schema.sql).
        run: |
          bun run db:migrate --baseline
          bun run db:migrate

      - name: Test
        run: bun test
