name: CI

# Gate de qualidade: typecheck + build + testes (integração contra um Postgres
# EFÊMERO — nunca o banco de prod). Ver docs/ci-cd-architecture.md.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_call:   # reutilizável: publish.yml/image.yml chamam como gate antes de release

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nio_cli
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NIO_DATABASE_URL: postgres://postgres:postgres@localhost:5432/nio_cli
      # ≥ 32 chars + variedade — o gateway rejeita segredo fraco (auditoria H-1).
      # Valor de teste efêmero, não é segredo real.
      JWT_SECRET: ci-only-4f9c2ka7Qh1Zpx8Rbn3Vdw6Tty0Lms5Ej

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Apply schema (Postgres efêmero)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          psql "$NIO_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Registrar baseline de migrações
        # schema.sql já inclui 0001..000N — marca como aplicadas e depois roda o
        # que sobrar (migração nova ainda não incorporada ao schema.sql).
        run: |
          bun run db:migrate --baseline
          bun run db:migrate

      - name: Test
        run: bun test
