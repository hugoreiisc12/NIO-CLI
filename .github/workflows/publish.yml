name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  gate:
    uses: ./.github/workflows/ci.yml   # roda o gate (typecheck+build+testes) antes de publicar

  publish:
    needs: gate                        # só publica no npm se o gate passar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish (pula se a versão já está no npm)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nio-cli/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "@nio-cli/cli@${VERSION} já publicado — nada a fazer."
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
