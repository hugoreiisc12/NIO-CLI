name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  gate:
    uses: ./.github/workflows/ci.yml   # roda o gate (typecheck+build+testes) antes de publicar

  publish:
    needs: gate                        # só publica no npm se o gate passar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag and manifest agree
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} não bate com package.json ${VERSION}."
              echo "Bump a versão no mesmo commit da tag, ou a tag v${VERSION} no commit certo."
              exit 1
            fi
          fi
          echo "manifest: $VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@nio-cli/cli@${VERSION}" version >/dev/null 2>&1; then
            # Já existe no npm. Num push de tag isso é erro: a tag é imutável e
            # diz que existe uma release que este repo não produziu — foi
            # exatamente assim que a v0.16.1 passou sem publicar nada. Só o
            # dispatch manual repete em silêncio.
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} mas @nio-cli/cli@${VERSION} já existe no npm — a tag aponta pra uma release que não saiu daqui."
              exit 1
            fi
            echo "@nio-cli/cli@${VERSION} já publicado — nada a fazer."
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
