name: Build & Push Gateway Image

# Em tag v* : builda a imagem do nio-gateway (Dockerfile.gateway + dist), empurra
# pro GHCR público, e pina a versão no docker-compose.deploy.yml (commit em main).
# O Portainer GitOps observa esse compose e redeploya. Ver docs/ci-cd-architecture.md.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/hugoreiis12-png/nio-gateway

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commitar o bump do tag no compose de deploy
      packages: write   # push no GHCR

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build (gera o dist/ que o Dockerfile copia)
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Pin a versão no compose de deploy + commit
        run: |
          TAG="${{ github.ref_name }}"
          # Substitui só o tag da imagem do nio-gateway no compose de deploy.
          sed -i -E "s#(ghcr.io/hugoreiis12-png/nio-gateway:)[^ ]+#\\1${TAG}#" docker/docker-compose.deploy.yml
          if git diff --quiet -- docker/docker-compose.deploy.yml; then
            echo "compose de deploy já aponta pra ${TAG} — nada a commitar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          sed -i -E "s#(ghcr.io/hugoreiis12-png/nio-gateway:)[^ ]+#\\1${TAG}#" docker/docker-compose.deploy.yml
          git add docker/docker-compose.deploy.yml
          git commit -m "chore(deploy): nio-gateway ${TAG} [skip ci]"
          git push origin main
